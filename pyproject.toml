[project]
name = "enki-research"
version = "0.1.0"
description = "Research search gateway for agents: SearXNG + free academic/code APIs + commercial search APIs within free quotas."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.3",
]
bench = [
    "pyyaml>=6.0",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.6",
    "pyyaml>=6.0",
]

# Retrievers discovered automatically by GPT Researcher
# (gpt_researcher/actions/retriever.py -> entry point group "gpt_researcher.retrievers").
[project.entry-points."gpt_researcher.retrievers"]
enki = "enki_research.integrations.gptr:EnkiSearch"
enki_academic = "enki_research.integrations.gptr:EnkiAcademicSearch"
enki_code = "enki_research.integrations.gptr:EnkiCodeSearch"
enki_news = "enki_research.integrations.gptr:EnkiNewsSearch"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/enki_research"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
